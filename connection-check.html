<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日経PDF抽出ツール・診断</title>
<style>
*{box-sizing:border-box}body{font:16px/1.7 system-ui,sans-serif;margin:0;background:#f5f6f7;color:#262a2e;letter-spacing:0}main{max-width:880px;margin:32px auto;padding:0 20px}header{border-bottom:1px solid #ccd2d7;padding-bottom:16px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 8px}.version{font-size:13px;color:#555}section{padding:20px 0;border-bottom:1px solid #d9dde1}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button{font:inherit;min-height:44px;padding:8px 16px;border:1px solid #88929b;border-radius:4px;background:white;color:#26323b;cursor:pointer}button.primary{background:#17644f;color:white;border-color:#17644f;font-weight:700}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #b96d00;outline-offset:3px}pre{font:14px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}#status{min-height:28px}#preview-note{color:#9b3200;font-weight:700}summary{cursor:pointer}a{color:#175d88}p{margin:8px 0}noscript{color:#9b3200}
</style>
<script defer src="storage-diagnostic.js?v=2026.10.12.2"></script>
<script defer src="diagnostic-download.js?v=2026.10.12.2"></script>
</head><body><main>
<header><h1>日経PDF抽出ツール・診断</h1><div class="version">診断ページ v2026.10.12.2</div></header>
<p id="preview-note" hidden>テスト環境です。本番の保存データは読み取れません。</p>
<section><h2>診断結果</h2><div class="actions"><button id="download" class="primary" type="button">診断結果をダウンロード</button><a id="download-again" hidden>同じ結果を再ダウンロード</a></div>
<p>記事・画像・進捗は変更しません。記事本文・画像本体・APIキーは診断ファイルに含めません。外部送信はありません。</p>
<p id="status" role="status" aria-live="polite">待機中</p><details id="report-details" hidden><summary>診断結果の内容</summary><pre id="report"></pre></details>
<noscript>JavaScriptが無効のため診断できません。</noscript></section>
<section><h2>画像取込拡張の接続</h2><pre id="result" role="status">確認中…</pre><button id="retry" type="button" disabled>接続を再確認</button></section>
</main></body></html>
